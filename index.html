<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cineteca</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<!-- Aquí vinculamos el archivo CSS externo -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span>ci</span>neteca</div>
    <nav class="tabs">
      <button class="tab active" data-tab="inicio">Inicio</button>
      <button class="tab" data-tab="peliculas">Películas</button>
      <button class="tab" data-tab="canales">Canales</button>
    </nav>
  </header>

  <section class="player-col">
    <div class="player-wrap">
      <video id="player" controls playsinline></video>
      <div class="fallback" id="fallback" hidden>
        <p>Este navegador web no tiene los códecs para reproducir este formato directamente, o el servidor bloqueó la conexión.</p>
        <a id="fallbackLink" href="#" target="_blank" rel="noopener">Abrir el archivo externamente o descargarlo</a>
      </div>
    </div>
    <div class="player-meta">
      <div>
        <span class="np-group" id="npGroup">Videoteca</span>
        <h2 class="np-title" id="npTitle">Elegí algo para reproducir</h2>
      </div>
      <div class="np-controls">
        <button id="prevBtn" aria-label="Anterior" disabled>‹</button>
        <button id="nextBtn" aria-label="Siguiente" disabled>›</button>
      </div>
    </div>
    <p class="status" id="status">Cargando playlist.m3u…</p>
  </section>

  <section id="panel-inicio" class="panel">
    <div class="panel-head">
      <h2>Películas</h2>
      <button class="see-all" data-goto="peliculas">Ver todas</button>
    </div>
    <div class="grid" id="homeMovies"></div>

    <div class="panel-head" style="margin-top:34px;">
      <h2>Canales</h2>
      <button class="see-all" data-goto="canales">Ver todos</button>
    </div>
    <div class="channels" id="homeChannels"></div>
  </section>

  <section id="panel-peliculas" class="panel" hidden>
    <div class="panel-head"><h2>Películas</h2></div>
    <div class="grid" id="allMovies"></div>
  </section>

  <section id="panel-canales" class="panel" hidden>
    <div class="panel-head"><h2>Canales</h2></div>
    <div class="channels" id="allChannels"></div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
const PLAYLIST_URL = "playlist.m3u";

function normalize(s){
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const items = [];
  let pending = null;
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith("#EXTINF")){
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      const comma = line.lastIndexOf(",");
      const title = comma !== -1 ? line.slice(comma + 1).trim() : "Sin título";
      pending = { 
        title, 
        group: groupMatch ? groupMatch[1].trim() : "",
        logo: logoMatch ? logoMatch[1].trim() : "" 
      };
    } else if(!line.startsWith("#")){
      const clean = line.split("?")[0];
      const ext = (clean.split(".").pop() || "").toLowerCase();
      items.push({
        title: pending ? pending.title : line,
        group: pending ? pending.group : "",
        logo: pending ? pending.logo : "",
        url: line,
        ext
      });
      pending = null;
    }
  }
  return items;
}

function isMovieGroup(group){
  const g = normalize(group);
  return g.includes("pelicula") || g.includes("movie") || g.includes("film");
}

function colorFor(title){
  let hash = 0;
  for(let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue} 38% 16%)`;
}

const video = document.getElementById("player");
const fallback = document.getElementById("fallback");
const fallbackLink = document.getElementById("fallbackLink");
const statusEl = document.getElementById("status");
const npGroup = document.getElementById("npGroup");
const npTitle = document.getElementById("npTitle");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let movies = [];
let channels = [];
let hls = null;
let current = null;
let currentList = [];

function isHlsUrl(url){
  // Expandido para intentar capturar también otras extensiones de flujo si es necesario
  return /\.m3u8($|\?)/i.test(url);
}

function playItem(item){
  current = item;
  currentList = isMovieGroup(item.group) ? movies : channels;

  npGroup.textContent = isMovieGroup(item.group) ? "Película" : (item.group || "Canal");
  npTitle.textContent = item.title;
  fallback.hidden = true;
  video.hidden = false;
  statusEl.textContent = "";
  statusEl.classList.remove("error");

  if(hls){ hls.destroy(); hls = null; }
  
  // Lógica de reproducción con tu proxy privado de Render
  if(isHlsUrl(item.url)){
    if(window.Hls && Hls.isSupported()){
      const PROXY_URL = "https://proxy-iptv-angel.onrender.com/proxy?url=";
      
      hls = new Hls({
        xhrSetup: function(xhr, url) {
          xhr.open('GET', PROXY_URL + encodeURIComponent(url), true);
        }
      });
      
      hls.loadSource(item.url);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (_e, data) => {
        if(data.fatal) {
            console.error("Error fatal HLS:", data);
            showFallback(item);
        }
      });
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src = "https://proxy-iptv-angel.onrender.com/proxy?url=" + encodeURIComponent(item.url);
      video.addEventListener('loadedmetadata', () => {
         video.play().catch(() => {});
      });
    } else {
      showFallback(item);
      return;
    }
  } else {
    // Archivos directos (mp4, etc.)
    video.src = item.url;
    video.play().catch(() => {});
  }

  prevBtn.disabled = currentList.length < 2;
  nextBtn.disabled = currentList.length < 2;

  refreshActiveStates();
}

function showFallback(item){
  fallback.hidden = false;
  video.hidden = true;
  fallbackLink.href = item.url;
}

video.addEventListener("error", () => { if(current) showFallback(current); });

prevBtn.addEventListener("click", () => step(-1));
nextBtn.addEventListener("click", () => step(1));
function step(delta){
  if(!current || currentList.length < 2) return;
  const idx = currentList.indexOf(current);
  const next = currentList[(idx + delta + currentList.length) % currentList.length];
  playItem(next);
}

function refreshActiveStates(){
  document.querySelectorAll("[data-url]").forEach(el => {
    el.classList.toggle("is-playing", current && el.dataset.url === current.url);
  });
}

function renderMovieCard(item){
  const btn = document.createElement("button");
  btn.className = "card";
  btn.dataset.url = item.url;
  
  const bgStyle = item.logo 
    ? `background: url('${item.logo}') center/cover no-repeat;` 
    : `background:${colorFor(item.title)}`;

  btn.innerHTML = `
    <div class="poster" style="${bgStyle}">
      <span class="play-dot"></span>
      <span class="fmt">${item.ext || "video"}</span>
    </div>
    <div class="card-title">${item.title}</div>`;
  btn.addEventListener("click", () => playItem(item));
  return btn;
}

function renderChannelRow(item, number){
  const row = document.createElement("button");
  row.className = "channel-row";
  row.dataset.url = item.url;
  
  const logoHtml = item.logo 
    ? `<img src="${item.logo}" style="width:32px; height:32px; border-radius:4px; object-fit:contain; flex-shrink:0;">` 
    : ``;

  row.innerHTML = `
    <span class="ch-num">${String(number).padStart(2, "0")}</span>
    ${logoHtml}
    <span class="ch-title">${item.title}</span>
    <span class="ch-fmt">${item.ext || "video"}</span>`;
  row.addEventListener("click", () => playItem(item));
  return row;
}

function fillGrid(container, items){
  container.innerHTML = "";
  if(items.length === 0){
    container.innerHTML = '<p class="empty-msg">Todavía no hay nada acá.</p>';
    return;
  }
  items.forEach(item => container.appendChild(renderMovieCard(item)));
}

function fillChannels(container, items){
  container.innerHTML = "";
  if(items.length === 0){
    container.innerHTML = '<p class="empty-msg">Todavía no hay canales cargados.</p>';
    return;
  }
  items.forEach((item, i) => container.appendChild(renderChannelRow(item, i + 1)));
}

const tabs = document.querySelectorAll(".tab");
const panels = {
  inicio: document.getElementById("panel-inicio"),
  peliculas: document.getElementById("panel-peliculas"),
  canales: document.getElementById("panel-canales")
};
function goToTab(name){
  tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  Object.entries(panels).forEach(([key, el]) => { el.hidden = key !== name; });
}
tabs.forEach(t => t.addEventListener("click", () => goToTab(t.dataset.tab)));
document.querySelectorAll("[data-goto]").forEach(btn => {
  btn.addEventListener("click", () => goToTab(btn.dataset.goto));
});

fetch(PLAYLIST_URL)
  .then(res => {
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  })
  .then(text => {
    const items = parseM3U(text);
    movies = items.filter(i => isMovieGroup(i.group));
    channels = items.filter(i => !isMovieGroup(i.group));

    fillGrid(document.getElementById("allMovies"), movies);
    fillChannels(document.getElementById("allChannels"), channels);
    fillGrid(document.getElementById("homeMovies"), movies.slice(0, 6));
    fillChannels(document.getElementById("homeChannels"), channels.slice(0, 6));

    statusEl.textContent = "";
    if(items.length === 0){
      statusEl.textContent = "La playlist está vacía.";
    } else {
      playItem(items[0]);
    }
  })
  .catch(err => {
    statusEl.textContent = "No se pudo cargar " + PLAYLIST_URL + " (" + err.message + "). Revisá que el archivo esté subido junto a este index.html.";
    statusEl.classList.add("error");
  });
</script>
</body>
</html>
