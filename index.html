<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cineteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120f;
    --panel: #1b1815;
    --panel-2: #201c18;
    --line: #33302a;
    --text: #ece7dc;
    --text-dim: #948c7c;
    --gold: #d9a856;
    --marquee: #b04632;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);height:100%;
    font-family:'Space Grotesk',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  button{font-family:inherit;}
  a{color:var(--gold);}

  .app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  /* ---------- header ---------- */
  .topbar{padding:26px 0 18px;border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;
    justify-content:space-between;}
  .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
    font-size:26px;letter-spacing:.2px;}
  .brand span{color:var(--gold);font-style:normal;}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px;}
  .tab{background:none;border:none;color:var(--text-dim);padding:8px 16px;
    border-radius:6px;font-size:14px;cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--panel-2);color:var(--text);}

  /* ---------- loader ---------- */
  .loader{display:flex;gap:8px;padding-top:20px;}
  .loader input{flex:1;background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:11px 14px;border-radius:6px;font-size:14px;
    font-family:inherit;min-width:0;}
  .loader input::placeholder{color:var(--text-dim);}
  .loader input:focus{outline:none;border-color:var(--gold);}
  .loader button{background:var(--gold);border:none;color:#221c12;font-weight:500;
    padding:0 20px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;}
  .loader button:hover{opacity:.9;}
  @media(max-width:520px){
    .loader{flex-direction:column;}
  }

  /* ---------- player ---------- */
  .player-col{padding-top:22px;}
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  video{width:100%;height:100%;display:block;background:#000;}
  .fallback{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;background:#0c0b09;
    text-align:center;padding:24px;}
  .fallback p{margin:0;color:var(--text-dim);font-size:14px;max-width:38ch;}
  .fallback a{font-size:14px;}

  .player-meta{display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;padding:16px 2px 4px;border-bottom:1px solid var(--line);}
  .np-group{display:block;font-size:12px;color:var(--gold);margin-bottom:4px;}
  .np-title{font-size:20px;}
  .np-controls{display:flex;gap:8px;flex-shrink:0;}
  .np-controls button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .np-controls button:hover{border-color:var(--gold);color:var(--gold);}
  .np-controls button:disabled{opacity:.35;cursor:default;}

  .status{font-size:13px;color:var(--text-dim);padding:10px 2px 0;min-height:18px;}
  .status.error{color:var(--marquee);}

  /* ---------- sections ---------- */
  .panel{padding-top:30px;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:16px;}
  .panel-head h2{font-size:19px;}
  .see-all{background:none;border:none;color:var(--text-dim);font-size:13px;
    cursor:pointer;}
  .see-all:hover{color:var(--gold);}
  .empty-msg{color:var(--text-dim);font-size:14px;padding:10px 2px;}

  /* movie grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;}
  .card{background:none;border:none;padding:0;text-align:left;cursor:pointer;color:var(--text);}
  .poster{aspect-ratio:2/3;border-radius:6px;border:1px solid var(--line);
    display:flex;align-items:flex-end;padding:10px;position:relative;
    overflow:hidden;}
  .poster .fmt{position:relative;font-size:11px;color:rgba(236,231,220,.75);
    background:rgba(0,0,0,.35);padding:2px 7px;border-radius:20px;
    align-self:flex-start;}
  .poster .play-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;
    border-radius:50%;background:var(--gold);display:none;}
  .card.is-playing .poster .play-dot{display:block;}
  .card.is-playing .poster{border-color:var(--gold);}
  .card-title{font-size:13px;margin-top:8px;line-height:1.3;color:var(--text-dim);}
  .card.is-playing .card-title{color:var(--text);}

  /* channel list */
  .channels{display:flex;flex-direction:column;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;}
  .channel-row{all:unset;display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--line);cursor:pointer;color:var(--text);}
  .channel-row:last-child{border-bottom:none;}
  .channel-row:hover{background:var(--panel);}
  .channel-row.is-playing{background:var(--panel-2);}
  .ch-num{font-family:'Fraunces',serif;font-size:15px;color:var(--text-dim);
    width:26px;flex-shrink:0;}
  .channel-row.is-playing .ch-num{color:var(--gold);}
  .ch-title{flex:1;font-size:14px;}
  .ch-fmt{font-size:11px;color:var(--text-dim);border:1px solid var(--line);
    padding:2px 8px;border-radius:20px;}

  @media(max-width:600px){
    .brand{font-size:22px;}
    .np-title{font-size:17px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span>ci</span>neteca</div>
    <nav class="tabs">
      <button class="tab active" data-tab="inicio">Inicio</button>
      <button class="tab" data-tab="peliculas">Películas</button>
      <button class="tab" data-tab="canales">Canales</button>
    </nav>
  </header>

  <section class="loader">
    <input type="text" id="m3uInput" placeholder="Pegá acá el link de tu lista .m3u o .m3u8">
    <button id="loadBtn">Cargar lista</button>
  </section>

  <section class="player-col">
    <div class="player-wrap">
      <video id="player" controls playsinline></video>
      <div class="fallback" id="fallback" hidden>
        <p>Este navegador no pudo reproducir el archivo (puede ser un problema de formato o de códec).</p>
        <a id="fallbackLink" href="#" target="_blank" rel="noopener">Abrir el archivo original en una pestaña nueva</a>
      </div>
    </div>
    <div class="player-meta">
      <div>
        <span class="np-group" id="npGroup">Videoteca</span>
        <h2 class="np-title" id="npTitle">Elegí algo para reproducir</h2>
      </div>
      <div class="np-controls">
        <button id="prevBtn" aria-label="Anterior" disabled>‹</button>
        <button id="nextBtn" aria-label="Siguiente" disabled>›</button>
      </div>
    </div>
    <p class="status" id="status">Cargando playlist.m3u…</p>
  </section>

  <section id="panel-inicio" class="panel">
    <div class="panel-head">
      <h2>Películas</h2>
      <button class="see-all" data-goto="peliculas">Ver todas</button>
    </div>
    <div class="grid" id="homeMovies"></div>

    <div class="panel-head" style="margin-top:34px;">
      <h2>Canales</h2>
      <button class="see-all" data-goto="canales">Ver todos</button>
    </div>
    <div class="channels" id="homeChannels"></div>
  </section>

  <section id="panel-peliculas" class="panel" hidden>
    <div class="panel-head"><h2>Películas</h2></div>
    <div class="grid" id="allMovies"></div>
  </section>

  <section id="panel-canales" class="panel" hidden>
    <div class="panel-head"><h2>Canales</h2></div>
    <div class="channels" id="allChannels"></div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
/* =========================================================================
   CONFIG
   Dónde está la playlist. Por defecto busca "playlist.m3u" al lado de este
   index.html, en el mismo repositorio. Si preferís apuntarla a una URL
   externa (por ejemplo un link público de tu Nextcloud), reemplazá el
   valor de abajo por esa URL completa.
   ========================================================================= */
const PLAYLIST_URL = "playlist.m3u";

/* =========================================================================
   PARSER M3U
   Soporta el atributo group-title="Películas" en la línea #EXTINF para
   clasificar cada video. Cualquier item sin group-title, o con un
   group-title que no diga "película/movie/film", cae en Canales.
   ========================================================================= */
function normalize(s){
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const items = [];
  let pending = null;
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith("#EXTINF")){
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      const comma = line.lastIndexOf(",");
      const title = comma !== -1 ? line.slice(comma + 1).trim() : "Sin título";
      pending = { title, group: groupMatch ? groupMatch[1].trim() : "" };
    } else if(!line.startsWith("#")){
      const clean = line.split("?")[0];
      const ext = (clean.split(".").pop() || "").toLowerCase();
      items.push({
        title: pending ? pending.title : line,
        group: pending ? pending.group : "",
        url: line,
        ext
      });
      pending = null;
    }
  }
  return items;
}

function isMovieGroup(group){
  const g = normalize(group);
  return g.includes("pelicula") || g.includes("movie") || g.includes("film");
}

/* deterministic accent color per title, just for the poster placeholder */
function colorFor(title){
  let hash = 0;
  for(let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue} 38% 16%)`;
}

/* =========================================================================
   ESTADO Y REPRODUCCIÓN
   ========================================================================= */
const video = document.getElementById("player");
const fallback = document.getElementById("fallback");
const fallbackLink = document.getElementById("fallbackLink");
const statusEl = document.getElementById("status");
const npGroup = document.getElementById("npGroup");
const npTitle = document.getElementById("npTitle");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let movies = [];
let channels = [];
let hls = null;
let current = null;      // item actualmente reproduciendo
let currentList = [];    // la lista (movies o channels) a la que pertenece

function isHlsUrl(url){
  return /\.m3u8($|\?)/i.test(url);
}

function playItem(item){
  current = item;
  currentList = isMovieGroup(item.group) ? movies : channels;

  npGroup.textContent = isMovieGroup(item.group) ? "Película" : (item.group || "Canal");
  npTitle.textContent = item.title;
  fallback.hidden = true;
  video.hidden = false;
  statusEl.textContent = "";
  statusEl.classList.remove("error");

  if(hls){ hls.destroy(); hls = null; }

  if(isHlsUrl(item.url)){
    if(window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(item.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if(data.fatal) showFallback(item);
      });
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src = item.url;
    } else {
      showFallback(item);
      return;
    }
  } else {
    video.src = item.url;
  }

  video.play().catch(() => {});

  prevBtn.disabled = currentList.length < 2;
  nextBtn.disabled = currentList.length < 2;

  refreshActiveStates();
}

function showFallback(item){
  fallback.hidden = false;
  video.hidden = true;
  fallbackLink.href = item.url;
}

video.addEventListener("error", () => { if(current) showFallback(current); });

prevBtn.addEventListener("click", () => step(-1));
nextBtn.addEventListener("click", () => step(1));
function step(delta){
  if(!current || currentList.length < 2) return;
  const idx = currentList.indexOf(current);
  const next = currentList[(idx + delta + currentList.length) % currentList.length];
  playItem(next);
}

function refreshActiveStates(){
  document.querySelectorAll("[data-url]").forEach(el => {
    el.classList.toggle("is-playing", current && el.dataset.url === current.url);
  });
}

/* =========================================================================
   RENDER
   ========================================================================= */
function renderMovieCard(item){
  const btn = document.createElement("button");
  btn.className = "card";
  btn.dataset.url = item.url;
  btn.innerHTML = `
    <div class="poster" style="background:${colorFor(item.title)}">
      <span class="play-dot"></span>
      <span class="fmt">${item.ext || "video"}</span>
    </div>
    <div class="card-title">${item.title}</div>`;
  btn.addEventListener("click", () => playItem(item));
  return btn;
}

function renderChannelRow(item, number){
  const row = document.createElement("button");
  row.className = "channel-row";
  row.dataset.url = item.url;
  row.innerHTML = `
    <span class="ch-num">${String(number).padStart(2, "0")}</span>
    <span class="ch-title">${item.title}</span>
    <span class="ch-fmt">${item.ext || "video"}</span>`;
  row.addEventListener("click", () => playItem(item));
  return row;
}

function fillGrid(container, items){
  container.innerHTML = "";
  if(items.length === 0){
    container.innerHTML = '<p class="empty-msg">Todavía no hay nada acá.</p>';
    return;
  }
  items.forEach(item => container.appendChild(renderMovieCard(item)));
}

function fillChannels(container, items){
  container.innerHTML = "";
  if(items.length === 0){
    container.innerHTML = '<p class="empty-msg">Todavía no hay canales cargados.</p>';
    return;
  }
  items.forEach((item, i) => container.appendChild(renderChannelRow(item, i + 1)));
}

/* =========================================================================
   TABS
   ========================================================================= */
const tabs = document.querySelectorAll(".tab");
const panels = {
  inicio: document.getElementById("panel-inicio"),
  peliculas: document.getElementById("panel-peliculas"),
  canales: document.getElementById("panel-canales")
};
function goToTab(name){
  tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  Object.entries(panels).forEach(([key, el]) => { el.hidden = key !== name; });
}
tabs.forEach(t => t.addEventListener("click", () => goToTab(t.dataset.tab)));
document.querySelectorAll("[data-goto]").forEach(btn => {
  btn.addEventListener("click", () => goToTab(btn.dataset.goto));
});

/* =========================================================================
   CARGA DE LA PLAYLIST
   Se puede cargar desde el link pegado en el campo de arriba (se guarda en
   este navegador para la próxima visita), o si no hay ninguno guardado,
   desde el archivo local PLAYLIST_URL.
   ========================================================================= */
const m3uInput = document.getElementById("m3uInput");
const loadBtn = document.getElementById("loadBtn");

function loadPlaylist(url){
  statusEl.textContent = "Cargando " + url + "…";
  statusEl.classList.remove("error");

  fetch(url)
    .then(res => {
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(text => {
      const items = parseM3U(text);
      movies = items.filter(i => isMovieGroup(i.group));
      channels = items.filter(i => !isMovieGroup(i.group));

      fillGrid(document.getElementById("allMovies"), movies);
      fillChannels(document.getElementById("allChannels"), channels);
      fillGrid(document.getElementById("homeMovies"), movies.slice(0, 6));
      fillChannels(document.getElementById("homeChannels"), channels.slice(0, 6));

      statusEl.textContent = "";
      if(items.length === 0){
        statusEl.textContent = "Esa lista llegó vacía o no se pudo leer.";
        statusEl.classList.add("error");
      } else {
        playItem(items[0]);
      }
    })
    .catch(err => {
      statusEl.textContent = "No se pudo cargar esa lista (" + err.message + "). Si el link es de otro sitio (no de este mismo repo), puede que ese servidor no permita cargarla desde acá (bloqueo CORS) — probá abriendo el link directo en el navegador para confirmar que funciona.";
      statusEl.classList.add("error");
    });
}

loadBtn.addEventListener("click", () => {
  const url = m3uInput.value.trim();
  if(!url) return;
  localStorage.setItem("lastM3uUrl", url);
  loadPlaylist(url);
});
m3uInput.addEventListener("keydown", e => {
  if(e.key === "Enter") loadBtn.click();
});

const savedUrl = localStorage.getItem("lastM3uUrl");
if(savedUrl){
  m3uInput.value = savedUrl;
  loadPlaylist(savedUrl);
} else {
  loadPlaylist(PLAYLIST_URL);
}
</script>
</body>
</html>
